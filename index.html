<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <!-- PWA & Mobile Web App Manifest -->
    <link rel="manifest" href="/manifest.json?v=2" crossorigin="use-credentials" />

    <!-- Icons & Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />

    <!-- Apple iOS Standalone & Startup Images -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TMA Builder" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />
    <link rel="apple-touch-startup-image" href="/icons/apple-splash.png" />

    <!-- Android Standalone & Theme Color -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#08080b" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08080b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    
    <!-- Critical DNS Prefetch & Preconnect for Google Fonts to minimize CLS and latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://telegram.org" />

    <!-- Primary Meta Tags -->
    <title>TMA Platform — Конструктор Telegram Web App & Онлайн-каталогов</title>
    <meta name="title" content="TMA Platform — Конструктор Telegram Web App & Онлайн-каталогов" />
    <meta name="description" content="Платформа для создания онлайн-витрин, каталогов услуг, доставки и Telegram Mini Apps для вашего бизнеса с приёмом заказов и аналитикой." />
    <meta name="keywords" content="telegram mini app, tma builder, онлайн-меню, доставка, каталог услуг, онлайн заказ, telegram бот, crm для бизнеса" />
    <meta name="author" content="TMA Platform" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#08080b" />
    <meta name="application-name" content="TMA Platform" />
    <meta name="apple-mobile-web-app-title" content="TMA Platform" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tma.dev" />
    <meta property="og:title" content="TMA Platform — Конструктор Telegram Web App & Онлайн-каталогов" />
    <meta property="og:description" content="Платформа для создания онлайн-витрин, каталогов услуг, доставки и Telegram Mini Apps для вашего бизнеса с приёмом заказов и аналитикой." />
    <meta property="og:site_name" content="TMA Platform" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TMA Platform — Конструктор Telegram Web App & Онлайн-каталогов" />
    <meta name="twitter:description" content="Платформа для создания онлайн-витрин, каталогов услуг, доставки и Telegram Mini Apps для вашего бизнеса с приёмом заказов и аналитикой." />

    <!-- Web Fonts with font-display: swap to prevent layout shifts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Schema.org JSON-LD Structured Data for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TMA Platform",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "description": "Платформа для создания онлайн-витрин, каталогов услуг, доставки и Telegram Mini Apps для вашего бизнеса.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "RUB"
        }
      }
    </script>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
